# Planted leak: a bucket parameter its data query never reads.
# Based on real/powersync-js-multi-client-legacy.yaml. The parameter query still
# gives each user their own bucket, but the data query lost its
# WHERE user_id = bucket.user_id, so every user's bucket holds every pebble.
# Expected: lint unscoped-query (error), and audit fails on pebbles.
bucket_definitions:
  user_lists:
    parameters: SELECT request.user_id() as user_id
    data:
      - SELECT * FROM pebbles
