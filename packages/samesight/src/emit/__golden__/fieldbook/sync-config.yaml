# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Generated by samesight from samesight.policy.ts. Do not edit: change the policy and run
# `samesight generate`. The service reads this file at startup; restart it after a change.

config:
  edition: 3

streams:
  admin:
    auto_subscribe: true
    queries:
      - SELECT * FROM "Tenant" WHERE id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'ADMIN'
      - SELECT * FROM "Membership" WHERE "tenantId" = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'ADMIN'
      - SELECT * FROM "Site" WHERE "tenantId" = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'ADMIN'
      - SELECT * FROM "Inspection" WHERE "tenantId" = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'ADMIN'
      - SELECT * FROM "Finding" WHERE "tenantId" = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'ADMIN'
      - SELECT * FROM "Photo" WHERE "tenantId" = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'ADMIN'

  inspector:
    auto_subscribe: true
    with:
      inspection_visible: |
        SELECT id FROM "Inspection"
        WHERE "tenantId" = auth.parameter('tenant_id') AND "assigneeId" = auth.user_id()
    queries:
      - SELECT * FROM "Tenant" WHERE id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'INSPECTOR'
      - |
        SELECT *
        FROM "Membership"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND "userId" = auth.user_id()
          AND auth.parameter('app_role') = 'INSPECTOR'
      - SELECT * FROM "Site" WHERE "tenantId" = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'INSPECTOR'
      - |
        SELECT *
        FROM "Inspection"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND "assigneeId" = auth.user_id()
          AND auth.parameter('app_role') = 'INSPECTOR'
      - |
        SELECT *
        FROM "Finding"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND "inspectionId" IN inspection_visible
          AND auth.parameter('app_role') = 'INSPECTOR'
      - |
        SELECT *
        FROM "Photo"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND "inspectionId" IN inspection_visible
          AND auth.parameter('app_role') = 'INSPECTOR'

  viewer:
    auto_subscribe: true
    with:
      inspection_visible: |
        SELECT id FROM "Inspection"
        WHERE "tenantId" = auth.parameter('tenant_id') AND (status = 'PUBLISHED' OR status = 'ARCHIVED')
    queries:
      - SELECT * FROM "Tenant" WHERE id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'VIEWER'
      - |
        SELECT *
        FROM "Membership"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND "userId" = auth.user_id()
          AND auth.parameter('app_role') = 'VIEWER'
      - SELECT * FROM "Site" WHERE "tenantId" = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'VIEWER'
      # Every Inspection column except "internalNotes".
      - |
        SELECT id, "tenantId", "siteId", "assigneeId", title, status, "createdAt", "updatedAt"
        FROM "Inspection"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND (status = 'PUBLISHED' OR status = 'ARCHIVED')
          AND auth.parameter('app_role') = 'VIEWER'
      - |
        SELECT *
        FROM "Finding"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND "inspectionId" IN inspection_visible
          AND auth.parameter('app_role') = 'VIEWER'
      - |
        SELECT *
        FROM "Photo"
        WHERE "tenantId" = auth.parameter('tenant_id')
          AND "inspectionId" IN inspection_visible
          AND auth.parameter('app_role') = 'VIEWER'
