# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# Local development only. PowerSync Cloud and production deployments use their own
# settings. Holds no secrets: the connection strings come from the environment
# (docker-compose.yml, fed by the gitignored .env that scripts/stack-up.sh writes).

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: 8080

sync_config:
  path: sync-config.yaml

client_auth:
  # Verify Supabase Auth tokens against the local project's JWKS (ES256 keys from
  # supabase/signing_keys.json). "kong" is the Supabase API gateway container.
  supabase: true
  jwks_uri: http://kong:8000/auth/v1/.well-known/jwks.json
  audience: ["authenticated"]
