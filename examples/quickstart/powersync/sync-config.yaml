# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Generated by samesight from samesight.policy.ts. Do not edit: change the policy and run
# `samesight generate`. The service reads this file at startup; restart it after a change.

config:
  edition: 3

streams:
  owner:
    auto_subscribe: true
    queries:
      - SELECT * FROM organizations WHERE id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'owner'
      - SELECT * FROM members WHERE org_id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'owner'
      - SELECT * FROM projects WHERE org_id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'owner'
      - SELECT * FROM tasks WHERE org_id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'owner'

  member:
    auto_subscribe: true
    queries:
      - SELECT * FROM organizations WHERE id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'member'
      - |
        SELECT *
        FROM members
        WHERE org_id = auth.parameter('tenant_id')
          AND user_id = auth.user_id()
          AND auth.parameter('app_role') = 'member'
      - SELECT * FROM projects WHERE org_id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'member'
      - SELECT * FROM tasks WHERE org_id = auth.parameter('tenant_id') AND auth.parameter('app_role') = 'member'
