# Local PowerSync service for the to-do list demo audit, next to the stack that
# `supabase start` runs in upstream/. Start both with `pnpm stack:up` (scripts/stack-up.sh),
# which also writes the gitignored .env this file reads.
#
# The PowerSync image is FSL-licensed: it runs here for local development and CI only,
# and is never bundled or redistributed.

name: audit-todolist

services:
  # Bucket storage for the PowerSync service, on this compose network only.
  powersync-storage:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    environment:
      POSTGRES_DB: powersync_storage
      POSTGRES_USER: powersync_storage
      POSTGRES_PASSWORD: ${PS_STORAGE_PASSWORD:?run pnpm stack:up}
    volumes:
      - powersync_storage:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powersync_storage -d powersync_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The same pinned image as Fieldbook's.
  # powersync-service-version: 1.27.2
  powersync:
    image: journeyapps/powersync-service@sha256:d7a99817057a42dae9e6d8fe0c70b49d99105dcac8b8ab0e9ed3cf1ff0978b8b
    restart: unless-stopped
    command: ["start", "-r", "unified"]
    depends_on:
      powersync-storage:
        condition: service_healthy
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://samesight_replication:${PS_REPLICATION_PASSWORD:?run pnpm stack:up}@supabase_db_react-supabase-todolist:5432/postgres
      PS_STORAGE_URI: postgresql://powersync_storage:${PS_STORAGE_PASSWORD:?run pnpm stack:up}@powersync-storage:5432/powersync_storage
    volumes:
      - ./powersync/service.yaml:/config/service.yaml:ro
      # The demo's sync config as published; scripts/verify-planted.sh swaps in a planted copy.
      - ${SYNC_CONFIG:-./upstream/sync-config.yaml}:/config/sync-config.yaml:ro
    ports:
      # Fixed: the audit scripts call 8081, and Fieldbook reads POWERSYNC_PORT.
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:8080/probes/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - default
      - supabase

volumes:
  powersync_storage:

networks:
  # Created by `supabase start`; named after the demo's project_id.
  supabase:
    name: supabase_network_react-supabase-todolist
    external: true
