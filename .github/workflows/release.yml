# Publishes the four packages to npm when a version tag (v0.1.0) is pushed.
#
# The tag must match every package's version (scripts/version.mjs sets them together).
# Nothing is published unless the checks, the unit tests and the packed-package smoke
# test pass on the tagged commit. Packages carry npm provenance, which links each
# tarball to this workflow run.
#
# Publishes with npm trusted publishing: no npm token is stored. Each of the four packages
# names this repository, this workflow (release.yml) and the "npm" environment as its
# trusted publisher on npmjs.com, and npm trades this run's OIDC token for a one-time
# publish credential.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only commits already on main are released.
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/version.mjs --check "$GITHUB_REF_NAME"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter fieldbook policy:check
      - run: pnpm smoke
      # Trusted publishing is npm's own: npm 11.5.1 or newer, on Node 22.14 or newer.
      - run: npm install --global "npm@^11.5.1" && npm --version
      # pnpm packs each package (prepack builds it, and workspace:^ ranges become the
      # released version); npm publishes the tarball, with provenance.
      # A version with a prerelease part (0.2.0-rc.1) goes to the "next" tag, not "latest".
      - name: Publish
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            # A rerun after a partial publish skips what npm already has.
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            out="$RUNNER_TEMP/packs/$(basename "$dir")"
            mkdir -p "$out"
            (cd "$dir" && pnpm pack --pack-destination "$out" > /dev/null)
            npm publish "$out"/*.tgz --access public --tag "$tag" --provenance
          done
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md)." $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
