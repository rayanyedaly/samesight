# Samesight CI.
#
# `quality` (typecheck + lint + unit tests + samesight check) needs no services or secrets and is the
# fast signal. `package` packs the npm packages and uses them from outside the workspace, on Linux
# and Windows. `verify` starts Fieldbook's local stack (Supabase and PowerSync, in Docker) and
# runs the database tests and the full verifier, mutation test included, against it.
# `action` runs the repo's own GitHub Action (action.yml) on the to-do list demo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Separate steps so a lint failure is distinguishable from a type error.
      - run: pnpm typecheck
      - run: pnpm lint
      # Serial, like the root script: later phases share one local database.
      - run: pnpm test
      # Generated access files (migration, sync config, client schema) match the policy.
      - run: pnpm --filter fieldbook policy:check
      - run: pnpm --filter quickstart policy:check

  package:
    name: packed packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packs each package as it would publish, installs the tarballs with npm outside the
      # workspace, and runs the CLIs, imports and a TypeScript consumer against them.
      - run: pnpm smoke

  verify:
    name: verifier on Fieldbook
    runs-on: ubuntu-latest
    # Above test:stack's own limit, so a hang there fails (with the logs step) rather than cancels.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supabase (supabase start) and the PowerSync service, with local random passwords.
      - run: pnpm --filter fieldbook stack:up
      - run: pnpm --filter fieldbook seed
      - run: pnpm --filter fieldbook test:db
      # Catalog tamper cases, the differential and the write path (rolled back, or cleaned up),
      # and a --mutate run stopped by Ctrl+C, which restarts PowerSync on the original sync
      # config and waits for it to catch up before the gate below.
      - run: pnpm --filter @samesight/verify test:stack
        timeout-minutes: 25
      # The gate: static, catalog, differential, write path and every mutant caught, in under 5 minutes.
      - name: samesight-verify --mutate
        working-directory: examples/fieldbook
        run: timeout 300 pnpm exec samesight-verify --mutate --runs 4
      - if: failure()
        working-directory: examples/fieldbook
        run: docker compose logs powersync --tail 100
      - if: always()
        run: pnpm --filter fieldbook stack:down

  quickstart:
    name: verifier on the quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The project the getting-started guide produces: a policy drafted by samesight init.
      - run: pnpm --filter quickstart stack:up
      - run: pnpm --filter quickstart policy:doctor
      - name: samesight-verify --mutate
        working-directory: examples/quickstart
        run: timeout 300 pnpm run policy:verify --runs 4
      - if: failure()
        working-directory: examples/quickstart
        run: PS_STORAGE_PASSWORD=unused PS_REPLICATION_PASSWORD=unused docker compose logs powersync --tail 100
      - if: always()
        run: pnpm --filter quickstart stack:down

  audit:
    name: audit mode on the to-do list demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fetches PowerSync's demo at a pinned commit (hash-checked), then Supabase. Each audit
      # below starts its own PowerSync (auto-start) and removes it.
      - run: pnpm --filter audit-todolist stack:up
      # Planted catalog, RLS and insert-policy breakages (rolled back), and auto-start's
      # clean-up on Ctrl+C, SIGTERM and SIGKILL.
      - run: pnpm --filter @samesight/verify test:audit
      # The Phase 5 gate: the demo as published passes, with both policies and both stream
      # tables seen allowing and refusing, and a planted sync config divergence is caught.
      - name: samesight-verify audit
        run: >-
          timeout 300 bash scripts/ci/verify-coverage.sh examples/audit-todolist
          "2 of 2 RLS read policies on synced tables were seen both allowing and refusing a run user a row\. 2 of 2 stream/table pairs both sent and withheld a row\."
          --project upstream --sync-config upstream/sync-config.yaml --runs 4 --seed 7
      - name: samesight-verify audit on a planted sync config
        working-directory: examples/audit-todolist
        run: timeout 420 pnpm run verify:planted
      # The same rules as legacy sync rules (bucket_definitions): pass, and catch a planted leak.
      - name: samesight-verify audit on sync rules
        working-directory: examples/audit-todolist
        run: timeout 600 pnpm run verify:rules
      # Every auto-started container, role and slot, every run user and every run row must be
      # gone after the runs above, and the demo's own publication untouched.
      - name: nothing left behind
        if: ${{ !cancelled() }}
        run: bash scripts/ci/left-behind.sh supabase_db_react-supabase-todolist powersync all
      - if: failure()
        run: docker logs supabase_db_react-supabase-todolist --tail 100 || true
      - if: always()
        run: pnpm --filter audit-todolist stack:down

  action:
    name: the GitHub Action on the to-do list demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # version: installed runs what is on the PATH: the workspace CLIs (linked into the
      # quickstart, which depends on both) and the pinned Supabase CLI.
      - run: |
          echo "$GITHUB_WORKSPACE/examples/quickstart/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      # The demo as published, and a copy whose lists query lost its owner filter (as in
      # verify-planted.sh).
      - name: fetch the demo and plant a leak
        run: |
          bash examples/audit-todolist/scripts/fetch.sh
          cd examples/audit-todolist/upstream
          sed 's/^\( *- SELECT \* FROM lists\) WHERE owner_id = auth.user_id()$/\1/' sync-config.yaml > sync-config.planted.yaml
          if cmp -s sync-config.yaml sync-config.planted.yaml; then
            echo "the lists query was not found; has the demo changed?" >&2
            exit 1
          fi
      - name: lint on the demo as published
        uses: ./
        with:
          mode: lint
          version: installed
          sync-config: examples/audit-todolist/upstream/sync-config.yaml
          project: examples/audit-todolist/upstream
      - name: lint on the planted copy
        id: lint_planted
        continue-on-error: true
        uses: ./
        with:
          mode: lint
          version: installed
          sync-config: examples/audit-todolist/upstream/sync-config.planted.yaml
          project: examples/audit-todolist/upstream
      - name: the planted lint failed, with its SARIF result at the planted line
        env:
          OUTCOME: ${{ steps.lint_planted.outcome }}
          EXIT_CODE: ${{ steps.lint_planted.outputs.exit-code }}
          SARIF: ${{ steps.lint_planted.outputs.sarif-file }}
        run: |
          planted=examples/audit-todolist/upstream/sync-config.planted.yaml
          line=$(grep -n '^ *- SELECT \* FROM lists$' "$planted" | cut -d: -f1)
          if [ "$OUTCOME" != failure ] || [ "$EXIT_CODE" != 1 ]; then
            echo "the planted lint ended $OUTCOME with exit code '$EXIT_CODE', not failure with 1" >&2
            exit 1
          fi
          node -e '
          const [file, line] = process.argv.slice(1);
          const sarif = JSON.parse(require("node:fs").readFileSync(file, "utf8"));
          const hit = sarif.runs.flatMap((r) => r.results ?? []).find((r) => r.ruleId === "unscoped-query" &&
            r.locations?.some((l) => l.physicalLocation?.region?.startLine === Number(line) &&
              l.physicalLocation.artifactLocation?.uri?.endsWith("sync-config.planted.yaml")));
          if (!hit) {
            console.error(`no unscoped-query result at sync-config.planted.yaml line ${line} in ${file}`);
            process.exit(1);
          }
          ' "$SARIF" "$line"
      # The action starts Supabase, audits and stops it (removing its data).
      - name: audit on the demo as published
        timeout-minutes: 10
        uses: ./
        with:
          mode: audit
          version: installed
          sync-config: examples/audit-todolist/upstream/sync-config.yaml
          project: examples/audit-todolist/upstream
          args: --runs 4 --seed 7
      # Started here instead, so the action uses it as it is and leaves it running for the
      # check below.
      - run: pnpm --filter audit-todolist stack:up
      - name: audit on the planted copy
        id: audit_planted
        continue-on-error: true
        timeout-minutes: 10
        uses: ./
        with:
          mode: audit
          version: installed
          sync-config: examples/audit-todolist/upstream/sync-config.planted.yaml
          project: examples/audit-todolist/upstream
          args: --runs 3 --time-limit 60
      - name: the planted audit failed on the lists leak
        env:
          OUTCOME: ${{ steps.audit_planted.outcome }}
          EXIT_CODE: ${{ steps.audit_planted.outputs.exit-code }}
          REPORT: ${{ steps.audit_planted.outputs.report-file }}
        run: |
          if [ "$OUTCOME" != failure ] || [ "$EXIT_CODE" != 1 ]; then
            echo "the planted audit ended $OUTCOME with exit code '$EXIT_CODE', not failure with 1" >&2
            exit 1
          fi
          if ! grep -qE "^### leak: u[0-9]+ .*received lists .*; RLS returns no such row" "$REPORT"; then
            echo "the report at '$REPORT' lacks the planted lists leak" >&2
            exit 1
          fi
      - name: nothing left behind
        if: ${{ !cancelled() }}
        run: bash scripts/ci/left-behind.sh supabase_db_react-supabase-todolist powersync all
      - if: failure()
        run: docker logs supabase_db_react-supabase-todolist --tail 100 || true
      - if: always()
        run: pnpm --filter audit-todolist stack:down

  roles:
    name: audit mode on the roles app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supabase only; each audit below starts its own PowerSync (auto-start) and removes it.
      - run: pnpm --filter audit-roles stack:up
      # Claim discovery, the catalog and the access token hook's rows on an app whose rules
      # read app_metadata and claims the hook adds.
      - run: pnpm --filter @samesight/verify test:roles
      # Every policy and stream, the role, org and team ones included, is seen both ways (a
      # fixed seed, so a changed summary replays its datasets). Eight datasets: with the
      # hook's teams in the mix, four at this seed never put an archived document before a
      # reader the restrictive policy keeps it from.
      - name: samesight-verify audit
        run: >-
          timeout 600 bash scripts/ci/verify-coverage.sh examples/audit-roles
          "9 of 9 RLS read policies on synced tables were seen both allowing and refusing a run user a row\. 8 of 8 stream/table pairs both sent and withheld a row\."
          --sync-config sync-config.yaml --runs 8 --seed 7 --time-limit 300
      # Run users hold the roles the rules compare: a leak only editors see must be caught.
      - name: samesight-verify audit on a planted editor leak
        working-directory: examples/audit-roles
        run: timeout 420 pnpm run verify:planted
      # Run users hold the team roles the hook adds from their memberships: a leak only team
      # members see must be caught.
      - name: samesight-verify audit on a planted team leak
        working-directory: examples/audit-roles
        run: timeout 420 pnpm run verify:planted-team
      - name: nothing left behind
        if: ${{ !cancelled() }}
        run: bash scripts/ci/left-behind.sh supabase_db_samesight-audit-roles powersync
      - if: failure()
        run: docker logs supabase_db_samesight-audit-roles --tail 100 || true
      - if: always()
        run: pnpm --filter audit-roles stack:down
