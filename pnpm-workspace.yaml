packages:
  - "packages/*"
  - "examples/*"

# pnpm 10 blocks dependency build scripts unless they are allowlisted under
# onlyBuiltDependencies. None are needed yet: the Supabase CLI, Biome and Turbo
# ship their binaries as per-platform optional dependencies.

# Next.js pulls these in optionally; their build scripts are not needed here.
ignoredBuiltDependencies:
  - sharp
  # Serwist's build tooling; @swc/core ships its binary as an optional dependency.
  - "@swc/core"
  - unrs-resolver
  # Ships prebuilt binaries for each platform; @powersync/node loads them directly.
  - better-sqlite3
